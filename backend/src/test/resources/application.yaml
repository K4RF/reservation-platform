spring:
  datasource:
    url: jdbc:h2:mem:reservation;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6380
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: true
    consumer:
      group-id: reservation-platform-reservation-post-processing-test
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: junsik.reservation.event.reservation
    listener:
      ack-mode: record
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - email
              - profile

jwt:
  secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  issuer: reservation-platform-test
  access-token-expiration: 30m
  refresh-token-expiration: 14d

reservation:
  kafka:
    enabled: false
    reservation-topic: reservation.events.v1
    partitions: 3
    replication-factor: 1
  cache:
    enabled: false
    detail-ttl: 10m
    miss-lock-retry-interval: 50ms
    miss-lock-ttl: 5s
  distributed-lock:
    wait-time: 3s
    lease-time: 30s
