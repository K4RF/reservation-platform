spring:
  application:
    name: backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:reservation}}
    username: ${MYSQL_USER:reservation}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:reservation-platform}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}
