spring:
  application:
    name: backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:reservation}}
    username: ${MYSQL_USER:reservation}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:1s}
      repositories:
        enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:reservation-platform}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}

reservation:
  cache:
    enabled: ${RESERVATION_CACHE_ENABLED:true}
    detail-ttl: ${RESERVATION_DETAIL_CACHE_TTL:10m}
    miss-lock-retry-interval: ${RESERVATION_CACHE_MISS_LOCK_RETRY_INTERVAL:50ms}
    miss-lock-ttl: ${RESERVATION_CACHE_MISS_LOCK_TTL:5s}
  distributed-lock:
    wait-time: ${RESERVATION_LOCK_WAIT_TIME:3s}
    lease-time: ${RESERVATION_LOCK_LEASE_TIME:30s}
