spring:
  application:
    name: backend
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:reservation}}
    username: ${MYSQL_USER:reservation}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:1s}
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:reservation-platform-reservation-post-processing-v1}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: junsik.reservation.event.reservation
    listener:
      ack-mode: record
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:reservation-platform}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}

reservation:
  kafka:
    enabled: ${RESERVATION_KAFKA_ENABLED:true}
    reservation-topic: ${KAFKA_RESERVATION_TOPIC:reservation.events.v1}
    partitions: ${KAFKA_RESERVATION_TOPIC_PARTITIONS:3}
    replication-factor: ${KAFKA_RESERVATION_TOPIC_REPLICATION_FACTOR:1}
    outbox:
      enabled: ${RESERVATION_KAFKA_OUTBOX_ENABLED:true}
      scheduling-enabled: ${RESERVATION_KAFKA_OUTBOX_SCHEDULING_ENABLED:true}
      publish-interval: ${RESERVATION_KAFKA_OUTBOX_PUBLISH_INTERVAL:1s}
      batch-size: ${RESERVATION_KAFKA_OUTBOX_BATCH_SIZE:50}
      publish-timeout: ${RESERVATION_KAFKA_OUTBOX_PUBLISH_TIMEOUT:5s}
  cache:
    enabled: ${RESERVATION_CACHE_ENABLED:true}
    detail-ttl: ${RESERVATION_DETAIL_CACHE_TTL:10m}
    miss-lock-retry-interval: ${RESERVATION_CACHE_MISS_LOCK_RETRY_INTERVAL:50ms}
    miss-lock-ttl: ${RESERVATION_CACHE_MISS_LOCK_TTL:5s}
  distributed-lock:
    wait-time: ${RESERVATION_LOCK_WAIT_TIME:3s}
    lease-time: ${RESERVATION_LOCK_LEASE_TIME:30s}
