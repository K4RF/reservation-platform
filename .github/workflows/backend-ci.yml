name: Backend CI

on:
  pull_request:
    branches:
      - develop

  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - "load-test/**"
      - "infra/observability/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  build:
    name: Test and Build
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.4
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build
        run: ./gradlew build -x test

  isolated-runner:
    name: Isolated Runner Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24.19.0
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"

      - name: Test runner contracts
        run: node --test load-test/*.test.mjs
