global:
  scrape_interval: 15s
  scrape_timeout: 3s
  evaluation_interval: 15s
scrape_configs:
  - job_name: reservation
    metrics_path: /actuator/prometheus
    follow_redirects: false
    sample_limit: 2000
    label_limit: 16
    label_value_length_limit: 200
    body_size_limit: 2MB
    basic_auth:
      username: reservation-scraper
      password_file: /run/monitoring/scrape.secret
    static_configs:
      - targets: ["backend:9091"]
