# Use run.mjs; all traffic stays on a project-scoped, internal network.
x-owned: &owned
  reservation.load.run: ${LOAD_ID:?run ID required}
services:
  mysql:
    image: mysql:8.4
    labels: *owned
    cpus: 2
    mem_limit: 1536m
    command: ["--performance-schema=ON", "--slow-query-log=ON", "--long-query-time=0.25", "--log-output=TABLE"]
    environment:
      MYSQL_DATABASE: reservation_load
      MYSQL_USER: reservation_load
      MYSQL_PASSWORD: ${LOAD_DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${LOAD_ROOT_PASSWORD:?}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4
    labels: *owned
    cpus: 0.5
    mem_limit: 320m
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 12
  kafka:
    image: apache/kafka:4.3.1
    labels: *owned
    cpus: 1
    mem_limit: 1024m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    volumes:
      - kafka-data:/var/lib/kafka/data
      - kafka-config:/mnt/shared/config
      - kafka-secrets:/etc/kafka/secrets
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20
  backend:
    image: eclipse-temurin:21-jdk
    labels: *owned
    cpus: 2
    mem_limit: 1536m
    working_dir: /isolated
    # Only the packaged JAR is visible here, not the repository or any .env file.
    command: ["java", "-Xms256m", "-Xmx512m", "-jar", "/app.jar", "--spring.config.location=classpath:/application.yaml", "--spring.config.import="]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/reservation_load
      MYSQL_USER: reservation_load
      MYSQL_PASSWORD: ${LOAD_DB_PASSWORD:?}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_CONSUMER_GROUP_ID: reservation-load-consumer
      MEDIA_STORAGE_ROOT: /media
      JWT_SECRET: ${LOAD_JWT:?}
      JWT_ISSUER: reservation-load-${LOAD_ID:?}
      JWT_ACCESS_TOKEN_EXPIRATION: 1h
      GOOGLE_CLIENT_ID: load-test-placeholder
      GOOGLE_CLIENT_SECRET: load-test-placeholder
      OAUTH2_FRONTEND_BASE_URL: http://backend:8080
      RESERVATION_CACHE_ENABLED: ${LOAD_CACHE:?}
      SPRING_DATASOURCE_HIKARI_REGISTER_MBEANS: "true"
      SPRING_DATASOURCE_HIKARI_POOL_NAME: ReservationLoad
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 10
    volumes:
      - type: bind
        source: ${LOAD_JAR:?}
        target: /app.jar
        read_only: true
        bind: { create_host_path: false }
      - ./observe/Observe.java:/Observe.java:ro
      - media:/media
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
  fixture:
    image: node:24.14.0-alpine
    labels: *owned
    cpus: 0.75
    mem_limit: 256m
    command: ["sleep", "infinity"]
    environment:
      LOAD_ID: ${LOAD_ID:?}
    volumes:
      - ./fixture.mjs:/fixture.mjs:ro
      - fixture-data:/private
  k6:
    image: grafana/k6:2.0.0@sha256:a33a0cfdc4d2483d6b7a3a22e726a499ff2831a671a49239104cd34a9937523c
    labels: *owned
    profiles: [generator]
    cpus: 1
    mem_limit: 320m
    user: ${LOAD_OUTPUT_USER:?}
    environment:
      LOAD_ID: ${LOAD_ID:?}
    volumes:
      - ./k6:/scripts:ro
      - fixture-data:/private:ro
      - type: bind
        source: ${LOAD_RESULTS:?}
        target: /results
        bind: { create_host_path: false }
networks:
  default:
    internal: true
    labels: *owned
volumes:
  mysql-data: { labels: *owned }
  kafka-data: { labels: *owned }
  kafka-config: { labels: *owned }
  kafka-secrets: { labels: *owned }
  media: { labels: *owned }
  fixture-data: { labels: *owned }
